name: Update activities for the TV page

on:
  schedule:
    - cron: "17 9 * * *"   # every day around 3-4 AM Minnesota time
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect upcoming activities
        run: python scripts/update_activities.py

      - name: Save the new list to the website
        run: |
          git config user.name "Blossom Hill activities bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/activities.json
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Update activities list"
            git push
          fi
