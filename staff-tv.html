<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Who's Working | Blossom Hill</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/BlossomHill/Top3-260.webp">
<style>
  /* --u is the size unit, tuned for full screen, left/right half, and top/bottom half. */
  :root { --purple: #9529d1; --deep: #5b1782; --cream: #fffaf3; --ink: #1f1a24; --muted: #5e5866; --u: 1vh; }
  @media (max-aspect-ratio: 7/5) { :root { --u: min(1vh, 1.25vw); } }
  @media (min-aspect-ratio: 5/2) { :root { --u: 1.6vh; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Open Sans", "Segoe UI", Arial, sans-serif; background: var(--cream); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden; cursor: none; }
  header { display: flex; align-items: center; gap: calc(2.5 * var(--u)); padding: calc(1.6 * var(--u)) calc(4 * var(--u));
    background: linear-gradient(90deg, var(--deep), var(--purple)); color: #fff; }
  header img { height: calc(9 * var(--u)); width: auto; background: #fff; border-radius: var(--u); padding: calc(.6 * var(--u)) calc(.8 * var(--u)); }
  header h1 { font-family: Georgia, "Playfair Display", serif; font-size: calc(4.8 * var(--u)); line-height: 1.1; }
  header p { font-size: calc(2.3 * var(--u)); opacity: .9; }
  .clock { margin-left: auto; text-align: right; flex: none; }
  .clock b { display: block; font-size: calc(6 * var(--u)); line-height: 1; }
  .clock span { font-size: calc(2.6 * var(--u)); }
  main { flex: 1; min-height: 0; padding: calc(2.2 * var(--u)) calc(4 * var(--u)) calc(1.5 * var(--u)); display: flex; flex-direction: column; gap: calc(2 * var(--u)); }

  /* On duty now */
  .now { display: flex; align-items: center; gap: calc(2 * var(--u)); flex-wrap: wrap; background: #fff; border-radius: calc(2 * var(--u));
    padding: calc(1.4 * var(--u)) calc(2.5 * var(--u)); box-shadow: 0 calc(.4 * var(--u)) calc(1.6 * var(--u)) rgba(60, 20, 90, .1); }
  .now h2 { font-size: calc(3.2 * var(--u)); color: var(--deep); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: var(--u); }
  .now h2::before { content: ""; width: calc(1.8 * var(--u)); height: calc(1.8 * var(--u)); border-radius: 50%; background: #2fbf71;
    box-shadow: 0 0 0 calc(.6 * var(--u)) rgba(47, 191, 113, .25); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 calc(1.2 * var(--u)) rgba(47, 191, 113, .05); } }
  .now .pill { font-size: calc(3.4 * var(--u)); }
  .now .none { font-size: calc(3 * var(--u)); color: var(--muted); }

  /* A person's shift */
  .pill { display: inline-flex; align-items: center; gap: calc(1.2 * var(--u)); background: var(--c); color: #fff; border-radius: 99px;
    padding: calc(.5 * var(--u)) calc(2 * var(--u)) calc(.5 * var(--u)) calc(.5 * var(--u)); font-weight: 700; font-size: calc(2.6 * var(--u));
    box-shadow: 0 calc(.3 * var(--u)) calc(.8 * var(--u)) rgba(0, 0, 0, .12); max-width: 100%; }
  .pill .av { flex: none; width: 2.1em; height: 2.1em; border-radius: 50%; background: #fff; color: var(--c); display: grid; place-items: center; font-weight: 800; }
  .pill .tx { min-width: 0; line-height: 1.15; }
  .pill .tx small { display: block; font-weight: 600; font-size: .7em; opacity: .95; white-space: nowrap; }
  .pill .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

  /* The week */
  .week { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--days, 7), 1fr); gap: calc(1.4 * var(--u)); }
  .day { background: #fff; border-radius: calc(1.8 * var(--u)); padding: calc(1.4 * var(--u)); display: flex; flex-direction: column; gap: calc(1.2 * var(--u));
    border-top: calc(1 * var(--u)) solid #e6dcef; box-shadow: 0 calc(.3 * var(--u)) calc(1.2 * var(--u)) rgba(60, 20, 90, .07); min-width: 0; overflow: hidden; }
  .day.today { border-top-color: var(--purple); background: #fbf6ff; outline: calc(.4 * var(--u)) solid var(--purple); }
  .dname { text-align: center; line-height: 1.1; }
  .dname b { display: block; font-size: calc(2.6 * var(--u)); text-transform: uppercase; letter-spacing: .06em; color: var(--deep); }
  .dname span { font-size: calc(2.2 * var(--u)); color: var(--muted); font-weight: 600; }
  .slot { display: flex; flex-direction: column; gap: calc(.8 * var(--u)); }
  .slot .lbl { font-size: calc(1.9 * var(--u)); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .slot .lbl i { font-style: normal; }
  .slot .pill { font-size: calc(2.2 * var(--u)); }
  .open { font-size: calc(2 * var(--u)); color: #b3a9bd; font-style: italic; padding-left: var(--u); }
  /* Full screen and top/bottom half: each shift is a big colored block filling its column */
  .day .slot { flex: 1 1 0; min-height: 0; }
  .day .slot .pill { flex: 1 1 0; min-height: 0; flex-direction: column; justify-content: center; text-align: center; border-radius: calc(1.6 * var(--u));
    padding: var(--u); gap: calc(.8 * var(--u)); font-size: calc(3 * var(--u)); width: 100%; }
  .day .slot .pill .av { width: 2em; height: 2em; }
  .day .slot .pill small { font-size: .64em; white-space: nowrap; }
  .day .slot .open { flex: 1 1 0; display: grid; place-items: center; border: calc(.3 * var(--u)) dashed #ddd2e8; border-radius: calc(1.6 * var(--u)); padding: 0; }
  footer { padding: 0 calc(4 * var(--u)) calc(1.4 * var(--u)); font-size: calc(1.9 * var(--u)); color: var(--muted); display: flex; gap: calc(2 * var(--u)); }
  footer .key { display: flex; gap: calc(2 * var(--u)); flex-wrap: wrap; }

  /* Left or right half: one row per day */
  @media (max-aspect-ratio: 7/5) {
    header { padding: calc(1.4 * var(--u)) calc(3 * var(--u)); gap: calc(2 * var(--u)); }
    header img { height: calc(7 * var(--u)); }
    header h1 { font-size: calc(4.2 * var(--u)); }
    header p, .clock span, footer .upd { display: none; }
    .clock b { font-size: calc(4.6 * var(--u)); }
    main { padding-left: calc(3 * var(--u)); padding-right: calc(3 * var(--u)); }
    .week { grid-template-columns: 1fr; grid-template-rows: repeat(var(--days, 7), auto); align-content: start; gap: var(--u); }
    .day { flex-direction: row; align-items: center; padding: var(--u) calc(1.6 * var(--u)); border-top: 0; border-left: calc(1 * var(--u)) solid #e6dcef; }
    .day.today { border-left-color: var(--purple); }
    .dname { flex: none; width: calc(13 * var(--u)); text-align: left; }
    .slot { flex: 1 1 0; min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .slot .lbl { display: none; }
    .day .slot .pill { flex: 0 1 auto; flex-direction: row; text-align: left; border-radius: 99px; width: auto; font-size: calc(2.2 * var(--u));
      padding: calc(.5 * var(--u)) calc(2 * var(--u)) calc(.5 * var(--u)) calc(.5 * var(--u)); gap: calc(1.2 * var(--u)); }
    .day .slot .pill small { white-space: nowrap; }
    .day .slot .open { flex: 0 1 auto; border: 0; padding-left: var(--u); }
  }
  /* Top or bottom half: compact */
  @media (min-aspect-ratio: 5/2) {
    header { padding: var(--u) calc(4 * var(--u)); }
    header img { height: calc(7 * var(--u)); }
    header h1 { font-size: calc(4 * var(--u)); }
    header p, footer { display: none; }
    .clock b { font-size: calc(5 * var(--u)); }
    main { padding-top: calc(1.4 * var(--u)); gap: calc(1.4 * var(--u)); }
    .now { padding: calc(.8 * var(--u)) calc(2 * var(--u)); }
    .now h2 { font-size: calc(2.6 * var(--u)); }
    .now .pill { font-size: calc(2.6 * var(--u)); }
    .day { padding: var(--u); gap: calc(.8 * var(--u)); }
    .slot .lbl { display: none; }
    .day .slot .pill { flex-direction: row; gap: var(--u); font-size: calc(2.4 * var(--u)); text-align: left; }
    .day .slot .pill .av { width: 1.8em; height: 1.8em; }
  }
</style>
</head>
<body>
<header>
  <img src="img/BlossomHill/Top3-260.webp" alt="Blossom Hill">
  <div>
    <h1>Who's Working</h1>
    <p>Blossom Hill staff schedule</p>
  </div>
  <div class="clock"><b id="time">&nbsp;</b><span id="today">&nbsp;</span></div>
</header>
<main id="main"></main>
<footer>
  <div class="key"><span>☀️ Day shift</span><span>🌙 Night shift</span></div>
  <div class="upd" id="upd" style="margin-left:auto"></div>
</footer>

<script>
(function () {
  // Each person's color. Add new staff here, e.g.  'Maria': '#e4572e',
  // Anyone not listed gets a color picked automatically.
  var STAFF_COLORS = {
    'Barbara': '#2e9e5b',
    'Jes': '#f28c28',
    'Sandra': '#2b7bf0',
    'Ahmed': '#16a596',
    'Devetta': '#8e24aa'
  };
  var SPARE = ['#e4572e', '#0e9ddf', '#d1495b', '#16a596', '#c4507a', '#6c5ce7', '#b8860b', '#3a7d44'];
  var data = null;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function local(s) { var p = s.split(/[-T:]/); return new Date(+p[0], p[1] - 1, +p[2], +p[3], +p[4]); }
  function color(name) {
    if (STAFF_COLORS[name]) return STAFF_COLORS[name];
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return SPARE[h % SPARE.length];
  }
  function t(d) {
    var h = d.getHours(), m = d.getMinutes(), ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12;
    return h + (m ? ':' + pad(m) : '') + ' ' + ap;
  }
  function isDay(s) { var h = local(s.start).getHours(); return h >= 5 && h < 15; }
  function pill(s) {
    var a = local(s.start), b = local(s.end);
    return '<span class="pill" style="--c:' + color(s.name) + '"><span class="av">' + esc(s.name.charAt(0).toUpperCase()) + '</span>' +
      '<span class="tx"><span class="nm">' + esc(s.name) + '</span><small>' + (isDay(s) ? '☀️ ' : '🌙 ') + t(a) + ' – ' + t(b) + '</small></span></span>';
  }

  function tick() {
    var now = new Date();
    document.getElementById('time').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    document.getElementById('today').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function render() {
    var main = document.getElementById('main');
    if (!data) { main.innerHTML = '<div class="now"><span class="none">The schedule could not be loaded right now. Trying again shortly.</span></div>'; return; }
    var now = new Date();
    var onNow = data.shifts.filter(function (s) { return local(s.start) <= now && now < local(s.end); });
    var html = '<div class="now"><h2>On duty now</h2>' +
      (onNow.length ? onNow.map(pill).join('') : '<span class="none">No one is scheduled right now</span>') + '</div>';

    function weekHtml(days) {
      var w = '<div class="week" style="--days:' + days + '">';
      for (var i = 0; i < days; i++) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i), key = ymd(d);
        var mine = data.shifts.filter(function (s) { return s.start.slice(0, 10) === key; });
        var dayS = mine.filter(isDay), nightS = mine.filter(function (s) { return !isDay(s); });
        w += '<div class="day' + (i === 0 ? ' today' : '') + '"><div class="dname"><b>' +
          (i === 0 ? 'Today' : d.toLocaleDateString('en-US', { weekday: 'short' })) + '</b><span>' +
          d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</span></div>' +
          '<div class="slot"><div class="lbl"><i>☀️</i> Day</div>' + (dayS.length ? dayS.map(pill).join('') : '<span class="open">Open</span>') + '</div>' +
          '<div class="slot"><div class="lbl"><i>🌙</i> Night</div>' + (nightS.length ? nightS.map(pill).join('') : '<span class="open">Open</span>') + '</div></div>';
      }
      return w + '</div>';
    }

    // Show as many days as fit in the space (up to 7).
    for (var days = 7; days >= 2; days--) {
      main.innerHTML = html + weekHtml(days);
      var wk = main.querySelector('.week');
      if (main.scrollHeight <= main.clientHeight + 1 && wk.scrollWidth <= wk.clientWidth + 1 &&
          [].every.call(wk.children, function (c) { return c.scrollHeight <= c.clientHeight + 1; })) break;
    }
    var upd = data.updated ? new Date(data.updated) : null;
    document.getElementById('upd').textContent = upd ? 'Schedule updated ' + upd.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '';
  }

  function load() {
    fetch('data/staff.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { data = j; render(); })
      .catch(function () { if (!data) render(); });
  }

  var wait;
  addEventListener('resize', function () { clearTimeout(wait); wait = setTimeout(render, 300); });
  tick(); setInterval(tick, 10000);
  load(); setInterval(load, 10 * 60 * 1000);       // check for schedule changes every 10 minutes
  setInterval(render, 60 * 1000);                    // keep "On duty now" and "Today" current
})();
</script>
</body>
</html>
