<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<title>Who's Working | Blossom Hill</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/BlossomHill/Top3-260.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* --u is the size unit, tuned for full screen, left/right half, and top/bottom half. */
  :root { --purple: #9529d1; --deep: #5b1782; --cream: #fffaf3; --ink: #1f1a24; --muted: #5e5866; --u: 1vh; }
  @media (max-aspect-ratio: 7/5) { :root { --u: min(1vh, 1.25vw); } }
  @media (min-aspect-ratio: 5/2) { :root { --u: 1.6vh; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Open Sans", "Segoe UI", Arial, sans-serif; background: var(--cream); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden; cursor: none; }
  header { display: flex; align-items: center; gap: calc(2.5 * var(--u)); padding: calc(1.6 * var(--u)) calc(4 * var(--u));
    background: linear-gradient(90deg, var(--deep), var(--purple)); color: #fff; }
  header img { height: calc(9 * var(--u)); width: auto; background: #fff; border-radius: var(--u); padding: calc(.6 * var(--u)) calc(.8 * var(--u)); }
  header h1 { font-family: Georgia, "Playfair Display", serif; font-size: calc(4.8 * var(--u)); line-height: 1.1; }
  header p { font-size: calc(2.3 * var(--u)); opacity: .9; }
  .clock { margin-left: auto; text-align: right; flex: none; }
  .clock b { display: block; font-size: calc(6 * var(--u)); line-height: 1; }
  .clock span { font-size: calc(2.6 * var(--u)); }
  main { flex: 1; min-height: 0; padding: calc(2.2 * var(--u)) calc(4 * var(--u)) calc(1.5 * var(--u)); display: flex; flex-direction: column; gap: calc(2 * var(--u)); }

  /* On duty now */
  .now { display: flex; align-items: center; gap: calc(2 * var(--u)); flex-wrap: wrap; background: #fff; border-radius: calc(2 * var(--u));
    padding: calc(1.4 * var(--u)) calc(2.5 * var(--u)); box-shadow: 0 calc(.4 * var(--u)) calc(1.6 * var(--u)) rgba(60, 20, 90, .1); }
  .now h2 { font-size: calc(3.2 * var(--u)); color: var(--deep); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: var(--u); }
  .now h2::before { content: ""; width: calc(1.8 * var(--u)); height: calc(1.8 * var(--u)); border-radius: 50%; background: #2fbf71;
    box-shadow: 0 0 0 calc(.6 * var(--u)) rgba(47, 191, 113, .25); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 calc(1.2 * var(--u)) rgba(47, 191, 113, .05); } }
  .now .pill { font-size: calc(3.4 * var(--u)); }
  .now .none { font-size: calc(3 * var(--u)); color: var(--muted); }

  /* A person's shift */
  .pill { display: inline-flex; align-items: center; gap: calc(1.2 * var(--u)); background: var(--c); color: #fff; border-radius: 99px;
    padding: calc(.5 * var(--u)) calc(2 * var(--u)) calc(.5 * var(--u)) calc(.5 * var(--u)); font-weight: 700; font-size: calc(2.6 * var(--u));
    box-shadow: 0 calc(.3 * var(--u)) calc(.8 * var(--u)) rgba(0, 0, 0, .12); max-width: 100%; }
  .pill .av { flex: none; width: 2.1em; height: 2.1em; border-radius: 50%; background: #fff; color: var(--c); display: grid; place-items: center; font-weight: 800; }
  .pill .tx { min-width: 0; line-height: 1.15; }
  .pill .tx small { display: block; font-weight: 600; font-size: .7em; opacity: .95; white-space: nowrap; }
  .pill .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

  /* The week */
  .week { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--days, 7), 1fr); gap: calc(1.4 * var(--u)); }
  .day { background: #fff; border-radius: calc(1.8 * var(--u)); padding: calc(1.4 * var(--u)); display: flex; flex-direction: column; gap: calc(1.2 * var(--u));
    border-top: calc(1 * var(--u)) solid #e6dcef; box-shadow: 0 calc(.3 * var(--u)) calc(1.2 * var(--u)) rgba(60, 20, 90, .07); min-width: 0; overflow: hidden; }
  .day.today { border-top-color: var(--purple); background: #fbf6ff; outline: calc(.4 * var(--u)) solid var(--purple); }
  .dname { text-align: center; line-height: 1.1; }
  .dname b { display: block; font-size: calc(2.6 * var(--u)); text-transform: uppercase; letter-spacing: .06em; color: var(--deep); }
  .dname span { font-size: calc(2.2 * var(--u)); color: var(--muted); font-weight: 600; }
  .slot { display: flex; flex-direction: column; gap: calc(.8 * var(--u)); }
  .slot .lbl { font-size: calc(1.9 * var(--u)); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .slot .lbl i { font-style: normal; }
  .slot .pill { font-size: calc(2.2 * var(--u)); }
  .open { font-size: calc(2 * var(--u)); color: #b3a9bd; font-style: italic; padding-left: var(--u); }
  /* Full screen and top/bottom half: each shift is a big colored block filling its column */
  .day .slot { flex: 1 1 0; min-height: 0; }
  .day .slot .pill { flex: 1 1 0; min-height: 0; flex-direction: column; justify-content: center; text-align: center; border-radius: calc(1.6 * var(--u));
    padding: var(--u); gap: calc(.8 * var(--u)); font-size: calc(3 * var(--u)); width: 100%; }
  .day .slot .pill .av { width: 2em; height: 2em; }
  .day .slot .pill small { font-size: .64em; white-space: nowrap; }
  .day .slot .open { flex: 1 1 0; display: grid; place-items: center; border: calc(.3 * var(--u)) dashed #ddd2e8; border-radius: calc(1.6 * var(--u)); padding: 0; }
  footer { padding: 0 calc(4 * var(--u)) calc(1.4 * var(--u)); font-size: calc(1.9 * var(--u)); color: var(--muted); display: flex; gap: calc(2 * var(--u)); }
  footer .key { display: flex; gap: calc(2 * var(--u)); flex-wrap: wrap; }

  /* Left or right half: one row per day */
  @media (max-aspect-ratio: 7/5) {
    header { padding: calc(1.4 * var(--u)) calc(3 * var(--u)); gap: calc(2 * var(--u)); }
    header img { height: calc(7 * var(--u)); }
    header h1 { font-size: calc(4.2 * var(--u)); }
    header p, .clock span, footer .upd { display: none; }
    .clock b { font-size: calc(4.6 * var(--u)); }
    main { padding-left: calc(3 * var(--u)); padding-right: calc(3 * var(--u)); }
    .week { grid-template-columns: 1fr; grid-template-rows: repeat(var(--days, 7), max-content); align-content: start; gap: var(--u); }
    .day { flex-direction: row; align-items: center; padding: var(--u) calc(1.6 * var(--u)); border-top: 0; border-left: calc(1 * var(--u)) solid #e6dcef; }
    .day.today { border-left-color: var(--purple); }
    .dname { flex: none; width: calc(13 * var(--u)); text-align: left; }
    .slot { flex: 1 1 0; min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .slot .lbl { display: none; }
    .day .slot .pill { flex: 0 1 auto; flex-direction: row; text-align: left; border-radius: 99px; width: auto; font-size: calc(2.2 * var(--u));
      padding: calc(.5 * var(--u)) calc(2 * var(--u)) calc(.5 * var(--u)) calc(.5 * var(--u)); gap: calc(1.2 * var(--u)); }
    .day .slot .pill small { white-space: nowrap; }
    /* each name fills its half of the row, name big, time smaller */
    .day .slot { flex: 1 1 0; }
    .day .slot .pill { flex: 1 1 auto; width: 100%; font-size: calc(2.6 * var(--u)); padding-right: calc(1.2 * var(--u)); gap: calc(.9 * var(--u)); }
    .day .slot .pill .av { width: 1.7em; height: 1.7em; }
    .day .slot .pill .nm { font-size: 1.25em; line-height: 1.05; }
    .day .slot .pill small { font-size: .62em; }
    .dname { width: calc(9 * var(--u)) !important; padding-right: calc(.4 * var(--u)); }
    .day .slot .open { flex: 0 1 auto; border: 0; padding-left: var(--u); }
  }
  /* Tall screens: day name on the left, day shift above night shift (the page turns this on when it gives bigger text) */
  body.stack .day { display: grid; grid-template-columns: auto 1fr; grid-template-rows: max-content max-content; column-gap: calc(1.6 * var(--u)); row-gap: calc(.8 * var(--u)); align-items: center; }
  body.stack .dname { grid-row: 1 / span 2; }
  body.stack .slot { grid-column: 2; min-height: max-content; }
  body.stack .now { justify-content: center; }
  /* Top or bottom half: compact */
  @media (min-aspect-ratio: 5/2) {
    header { padding: var(--u) calc(4 * var(--u)); }
    header img { height: calc(7 * var(--u)); }
    header h1 { font-size: calc(4 * var(--u)); }
    header p, footer { display: none; }
    .clock b { font-size: calc(5 * var(--u)); }
    main { padding-top: calc(1.4 * var(--u)); gap: calc(1.4 * var(--u)); }
    .now { padding: calc(.8 * var(--u)) calc(2 * var(--u)); }
    .now h2 { font-size: calc(2.6 * var(--u)); }
    .now .pill { font-size: calc(2.6 * var(--u)); }
    .day { padding: var(--u); gap: calc(.8 * var(--u)); }
    .slot .lbl { display: none; }
    .day .slot .pill { flex-direction: row; gap: var(--u); font-size: calc(2.4 * var(--u)); text-align: left; }
    .day .slot .pill .av { width: 1.8em; height: 1.8em; }
  }

  /* ---------- Playful look ---------- */
  :root { --fun: "Fredoka", "Segoe UI Rounded", "Arial Rounded MT Bold", "Open Sans", Arial, sans-serif; }
  body { background: radial-gradient(circle at 10% 20%, #ffeccf 0, transparent 34%), radial-gradient(circle at 90% 25%, #e2f5ea 0, transparent 34%),
    radial-gradient(circle at 75% 92%, #e3ebff 0, transparent 40%), radial-gradient(circle at 20% 85%, #f6e6ff 0, transparent 36%), var(--cream); }
  header, main, footer { position: relative; z-index: 1; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .confetti span { position: absolute; opacity: .16; animation: drift 10s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateY(calc(-2.5 * var(--u))) rotate(14deg); } }
  header h1, header p, .dname b, .pill .nm, .now h2 { font-family: var(--fun); }
  header h1 { font-weight: 700; }
  header p { font-weight: 600; }
  .dname b { font-weight: 700; }
  .pill .nm { font-weight: 700; }
  /* on duty now */
  .now { border: calc(.35 * var(--u)) solid #d9f2e3; }
  .now h2 { font-weight: 700; }
  .now h2 .wave { display: inline-block; transform-origin: 70% 80%; animation: wave 2.4s ease-in-out infinite; }
  @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20%, 40% { transform: rotate(-8deg); } }
  body.fx .now .pill { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(calc(-.5 * var(--u))) scale(1.03); } }
  .now .pill .av { box-shadow: 0 0 0 calc(.35 * var(--u)) rgba(255, 255, 255, .55); animation: ring 2.6s ease-in-out infinite; }
  @keyframes ring { 50% { box-shadow: 0 0 0 calc(.9 * var(--u)) rgba(255, 255, 255, .15); } }
  /* name pills and blocks */
  .pill { position: relative; overflow: hidden;
    background-image: radial-gradient(rgba(255, 255, 255, .16) 18%, transparent 21%); background-size: calc(2.2 * var(--u)) calc(2.2 * var(--u)); }
  .pill::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .35), transparent);
    animation: shine 7s ease-in-out infinite; animation-delay: var(--dl, 0s); pointer-events: none; }
  @keyframes shine { 0%, 70% { left: -60%; } 100% { left: 130%; } }
  .pill .av { font-family: var(--fun); }
  .pill .ic { display: inline-block; }
  .pill .ic.sun { animation: spin 9s linear infinite; }
  .pill .ic.moon { animation: rock 3s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rock { 50% { transform: rotate(-18deg); } }
  .pill.night::before { content: "✦ ✧"; position: absolute; right: .5em; top: .15em; font-size: .55em; color: #fff; opacity: .7; animation: twinkle 2.2s ease-in-out infinite; pointer-events: none; }
  @keyframes twinkle { 50% { opacity: .15; } }
  body.fx .day .pill { transform: rotate(-1.2deg); }
  body.fx .day .slot + .slot .pill { transform: rotate(1.2deg); }
  /* days */
  .day { background-image: radial-gradient(#efe4f7 14%, transparent 16%); background-size: calc(2 * var(--u)) calc(2 * var(--u)); background-position: 0 0; background-color: #fff; }
  .day.today { background-color: #fbf3ff; animation: glow 3s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 calc(.5 * var(--u)) rgba(149, 41, 209, .18), 0 0 calc(2.4 * var(--u)) rgba(149, 41, 209, .35); } }
  .dname .party { font-size: .9em; }
  body.enter .day, body.enter .now { animation: pop .7s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: var(--dl, 0s); }
  body.enter .day.today { animation: pop .7s cubic-bezier(.2, 1.4, .4, 1) both, glow 3s ease-in-out .7s infinite; }
  @keyframes pop { from { opacity: 0; transform: translateY(calc(2 * var(--u))) scale(.92); } }
  .open { font-family: var(--fun); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<header>
  <img src="img/BlossomHill/Top3-260.webp" alt="Blossom Hill">
  <div>
    <h1>Who's Working</h1>
    <p id="greet">Blossom Hill staff schedule</p>
  </div>
  <div class="clock"><b id="time">&nbsp;</b><span id="today">&nbsp;</span></div>
</header>
<main id="main"></main>
<footer>
  <div class="key"><span>☀️ Day shift</span><span>🌙 Night shift</span></div>
  <div class="upd" id="upd" style="margin-left:auto"></div>
</footer>

<script>
(function () {
  // Always use Minnesota time, even if the sign player's clock is set to another time zone.
  function nowMN() {
    try { return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Chicago' })); } catch (e) { return new Date(); }
  }
  // Each person's color. Add new staff here, e.g.  'Maria': '#e4572e',
  // Anyone not listed gets a color picked automatically.
  var STAFF_COLORS = {
    'Barbara': '#2e9e5b',
    'Jes': '#f28c28',
    'Sandra': '#2b7bf0',
    'Ahmed': '#16a596',
    'Devetta': '#8e24aa'
  };
  var SPARE = ['#e4572e', '#0e9ddf', '#d1495b', '#16a596', '#c4507a', '#6c5ce7', '#b8860b', '#3a7d44'];
  var data = null;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function local(s) { var p = s.split(/[-T:]/); return new Date(+p[0], p[1] - 1, +p[2], +p[3], +p[4]); }
  function color(name) {
    if (STAFF_COLORS[name]) return STAFF_COLORS[name];
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return SPARE[h % SPARE.length];
  }
  function t(d) {
    var h = d.getHours(), m = d.getMinutes(), ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12;
    return h + (m ? ':' + pad(m) : '') + ' ' + ap;
  }
  function isDay(s) { var h = local(s.start).getHours(); return h >= 5 && h < 15; }
  function pill(s) {
    var a = local(s.start), b = local(s.end);
    var day = isDay(s);
    return '<span class="pill' + (day ? '' : ' night') + '" style="--c:' + color(s.name) + ';--dl:' + (Math.random() * 6).toFixed(1) + 's"><span class="av">' + esc(s.name.charAt(0).toUpperCase()) + '</span>' +
      '<span class="tx"><span class="nm">' + esc(s.name) + '</span><small><span class="ic ' + (day ? 'sun">☀️' : 'moon">🌙') + '</span> ' + t(a) + ' – ' + t(b) + '</small></span></span>';
  }

  var played = false;
  function greeting() { var h = nowMN().getHours(); return (h < 12 ? 'Good morning! 🌞' : h < 17 ? 'Good afternoon! 🌤️' : 'Good evening! 🌙') + ' Here’s who’s caring for you'; }
  function sprinkle() {   // soft shapes floating in the background
    var pics = ['☀️', '🌙', '⭐', '🌸', '💜', '☁️', '✨', '🌼'], box = document.createElement('div'), html = '';
    box.className = 'confetti';
    for (var i = 0; i < 24; i++) html += '<span style="left:' + (Math.random() * 96).toFixed(1) + '%;top:' + (Math.random() * 94).toFixed(1) +
      '%;font-size:calc(' + (2.6 + Math.random() * 3.6).toFixed(1) + ' * var(--u));animation-delay:-' + (Math.random() * 10).toFixed(1) + 's">' + pics[i % pics.length] + '</span>';
    box.innerHTML = html; document.body.insertBefore(box, document.body.firstChild);
  }
  function tick() {
    var now = nowMN();
    document.getElementById('time').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    document.getElementById('today').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('greet').textContent = greeting();
  }

  // Size unit: the page measures the default, then picks the largest size that still fits.
  function baseU() {
    document.documentElement.style.removeProperty('--u');
    var p = document.createElement('div'); p.style.cssText = 'position:absolute;visibility:hidden;width:calc(100 * var(--u))';
    document.body.appendChild(p); var w = p.getBoundingClientRect().width / 100; p.remove(); return w || 8;
  }
  function setU(px) { document.documentElement.style.setProperty('--u', px.toFixed(2) + 'px'); }
  function fitsNow(main) {
    var hd = document.querySelector('header'), wk = main.querySelector('.week'), nw = main.querySelector('.now');
    if (main.scrollHeight > main.clientHeight + 1) return false;
    if (hd.scrollWidth > hd.clientWidth + 1 || hd.offsetHeight > innerHeight * 0.2) return false;
    if (nw && nw.scrollWidth > nw.clientWidth + 1) return false;
    if (wk.scrollWidth > wk.clientWidth + 1) return false;
    var ok = [].every.call(wk.querySelectorAll('.day'), function (c) {
      if (c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1) return false;
      var r = c.getBoundingClientRect();
      return [].every.call(c.querySelectorAll('.pill'), function (pl) {
        var q = pl.getBoundingClientRect();
        if (q.right > r.right + 1 || q.bottom > r.bottom + 1 || pl.scrollWidth > pl.clientWidth + 1 || pl.scrollHeight > pl.clientHeight + 1) return false;
        return [].every.call(pl.querySelectorAll('small, .nm, .tx'), function (el) { var t = el.getBoundingClientRect(); return el.scrollWidth <= el.clientWidth + 1 && t.right <= q.right + 1 && t.bottom <= q.bottom + 1; });
      });
    });
    if (!ok) return false;
    var nr = nw && nw.getBoundingClientRect();
    return !nw || [].every.call(nw.querySelectorAll('.pill, .pill small, .pill .nm'), function (el) { return el.getBoundingClientRect().right <= nr.right + 1 && el.scrollWidth <= el.clientWidth + 1; });
  }

  function render() {
    var main = document.getElementById('main');
    if (!data) { main.innerHTML = '<div class="now"><span class="none">The schedule could not be loaded right now. Trying again shortly.</span></div>'; return; }
    var now = nowMN();
    var onNow = data.shifts.filter(function (s) { return local(s.start) <= now && now < local(s.end); });
    var html = '<div class="now"><h2><span class="wave">👋</span> On duty now</h2>' +
      (onNow.length ? onNow.map(pill).join('') : '<span class="none">No one is scheduled right now</span>') + '</div>';

    function weekHtml(days) {
      var w = '<div class="week" style="--days:' + days + '">';
      for (var i = 0; i < days; i++) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i), key = ymd(d);
        var mine = data.shifts.filter(function (s) { return s.start.slice(0, 10) === key; });
        var dayS = mine.filter(isDay), nightS = mine.filter(function (s) { return !isDay(s); });
        w += '<div class="day' + (i === 0 ? ' today' : '') + '" style="--dl:' + (0.15 + i * 0.09).toFixed(2) + 's"><div class="dname"><b>' +
          (i === 0 ? 'Today' : d.toLocaleDateString('en-US', { weekday: 'short' })) + '</b><span>' +
          d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</span></div>' +
          '<div class="slot"><div class="lbl"><i>☀️</i> Day</div>' + (dayS.length ? dayS.map(pill).join('') : '<span class="open">Open</span>') + '</div>' +
          '<div class="slot"><div class="lbl"><i>🌙</i> Night</div>' + (nightS.length ? nightS.map(pill).join('') : '<span class="open">Open</span>') + '</div></div>';
      }
      return w + '</div>';
    }

    // Show as many days as fit (up to 7), with the biggest text that fits the screen.
    document.body.classList.remove('fx');   // no tilts while measuring
    var root = document.documentElement, base = baseU(), narrow = innerWidth / innerHeight < 1.4;
    var hiK = narrow ? 2.4 : 1.35;
    // Finds the biggest size that fits with the most days; on narrow screens it also tries stacked shifts.
    function best(stack) {
      document.body.classList.toggle('stack', stack);
      for (var days = 7; days >= 2; days--) {
        main.innerHTML = html + weekHtml(days);
        setU(base * 0.6);
        if (!fitsNow(main)) continue;
        var lo = base * 0.6, hi = base * hiK;
        for (var i = 0; i < 12; i++) { var mid = (lo + hi) / 2; setU(mid); if (fitsNow(main)) lo = mid; else hi = mid; }
        return { days: days, u: lo, stack: stack };
      }
      return { days: 2, u: base * 0.6, stack: stack };
    }
    var pick = best(false);
    document.body.classList.toggle('stack', pick.stack);
    main.innerHTML = html + weekHtml(pick.days); setU(pick.u);
    document.body.classList.add('fx');
    if (!played) { played = true; document.body.classList.add('enter'); setTimeout(function () { document.body.classList.remove('enter'); }, 2500); }
    if (narrow) {   // spread the days out to use the whole height
      var wk = main.querySelector('.week'); wk.style.gridTemplateRows = 'repeat(' + pick.days + ', minmax(max-content, 1fr))'; wk.style.alignContent = 'stretch';
    }
    var upd = data.updated ? new Date(data.updated) : null;
    document.getElementById('upd').textContent = upd ? 'Schedule updated ' + upd.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago' }) : '';
  }

  function load() {
    fetch('data/staff.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { data = j; render(); })
      .catch(function () { if (!data) render(); });
  }

  var wait;
  addEventListener('resize', function () { clearTimeout(wait); wait = setTimeout(render, 300); });
  sprinkle();
  tick(); setInterval(tick, 10000);
  load(); setInterval(load, 10 * 60 * 1000);       // check for schedule changes every 10 minutes
  setInterval(render, 60 * 1000);                    // keep "On duty now" and "Today" current
})();
</script>
</body>
</html>
