<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blossom Hill Menu Maker</title>
<style>
  html,body{margin:0;background:#efe6fb;font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:#2b2140}
  #bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:#fff;border-bottom:2px solid #c9a8ee}
  button,.btn{font:inherit;font-size:18px;font-weight:600;padding:10px 20px;border-radius:10px;border:2px solid #7b4fc4;background:#fff;color:#4b2a8f;cursor:pointer}
  button:hover,.btn:hover{background:#f1e7ff}
  #shuffle{background:#7b4fc4;color:#fff;font-size:20px;padding:10px 28px}
  #shuffle:hover{background:#683cb3}
  .gap{flex:1}
  #status{padding:8px 16px;font-size:15px;min-height:20px}
  #status.err{color:#a01818;font-weight:600}
  #wrap{padding:0 16px 16px}
  canvas{display:block;width:100%;max-width:1500px;margin:0 auto;box-shadow:0 2px 14px rgba(60,20,120,.25);cursor:pointer}
  #hint{text-align:center;font-size:14px;color:#5a4a78;padding:8px}
  input[type=file]{display:none}
  #dailybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:#f7f1ff;border-bottom:2px solid #c9a8ee;font-size:17px}
  #dailybar b{color:#2c3a7a}
  #dailybar select{font:inherit;font-size:17px;padding:8px 10px;border:2px solid #7b4fc4;border-radius:10px;background:#fff;color:#2b2140}
  #dailybar button{font-size:17px;padding:8px 16px}
  #tvbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:#f3fbf5;border-bottom:2px solid #a9dcb8;font-size:17px}
  #tvbar button{font-size:17px;padding:8px 16px}
  #tvbar .gap{flex:1}
  #tvStatus.ok{color:#17663a;font-weight:600}
  #tvStatus.err{color:#a11d1d;font-weight:600}
  @media print{#tvbar{display:none !important}}
  #daily{background:#2c3a7a;border-color:#2c3a7a;color:#fff}
  #daily:hover{background:#24306a}
  #dailybar a{color:#4b2a8f;font-weight:600}
  .wserv{display:flex;align-items:center;gap:6px;font-weight:600;background:#fff;border:2px solid #c9a8ee;border-radius:12px;padding:4px 8px}
  .wserv input{width:64px;font:inherit;font-size:19px;font-weight:700;text-align:center;padding:5px;border:2px solid #7b4fc4;border-radius:10px}
  #dailybar .wserv button{width:40px;padding:5px 0;font-size:19px}
  #viewGroc.on{background:#2c3a7a;border-color:#2c3a7a;color:#fff}
  #grocBox{display:none;max-width:1500px;margin:6px auto 30px;padding:0 16px}
  #grocBox.open{display:block}
  #grocBox .ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;background:#fff;border-radius:16px 16px 0 0;padding:16px 22px 10px;border-bottom:3px solid #7b4fc4}
  #grocBox h2{margin:0;font-size:32px;color:#2c3a7a}
  #grocBox .gsub{color:#5a4a78;font-size:17px}
  #grocBox .gtools{margin-left:auto;display:flex;gap:8px}
  #grocBox .gtools button{font-size:16px;padding:7px 14px}
  #grocList{background:#fff;border-radius:0 0 16px 16px;padding:8px 22px 18px;columns:3 330px;column-gap:34px;box-shadow:0 2px 14px rgba(60,20,120,.15)}
  .gsec{break-inside:avoid;margin:12px 0 0}
  .gsec h3+.gitem{border-top:0}
  .gsec h3{margin:0 0 4px;font-size:20px;letter-spacing:.04em;color:#2c3a7a;border-bottom:2px solid #d9c6f3;padding-bottom:3px}
  .gitem{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;border-bottom:1px solid #f1e9fb;break-inside:avoid;cursor:pointer;font-size:18px}
  .gitem input{width:22px;height:22px;margin-top:3px;accent-color:#2c3a7a;flex:none;cursor:pointer}
  .gitem .gname{font-weight:600}
  .gitem .guse{display:block;font-size:14.5px;color:#5a4a78;line-height:1.35}
  .gitem.done .gname{text-decoration:line-through;color:#8b82a0}
  .gmiss{color:#a01818;font-weight:600;margin-top:10px}
  .gnote{color:#5a4a78;font-size:15px;margin:10px 0 0;column-span:all}
  #grocPrintPage{display:none}
  @media print{
    @page{size:letter portrait;margin:0.25in}
    body.printGroc{background:#fff}
    body.printGroc > *{display:none !important}
    body.printGroc #grocPrintPage{display:block !important;width:100%;height:10.4in;object-fit:contain;object-position:top center}
  }
</style>
</head>
<body>
<div id="bar">
  <button id="shuffle">Shuffle</button>
  <button id="png">Download PNG</button>
  <button id="pdf">Download PDF</button>
  <button id="viewGroc" aria-expanded="false">View Grocery List</button>
  <button id="groc">Download Grocery List</button>
  <span class="gap"></span>
  <label class="btn" for="file">Load food list (CSV)</label>
  <input type="file" id="file" accept=".csv,.txt">
  <button id="reset" title="Go back to the food list that came with the app">Use starting list</button>
</div>
<div id="dailybar">
  <div class="wserv" title="How many servings the Daily Food page and the TV show ingredients for, every day of this week's menu">
    Servings this week
    <button id="wsMinus" aria-label="Fewer servings">&minus;</button>
    <input id="wServ" type="number" min="1" max="60" value="4" aria-label="Servings for the week">
    <button id="wsPlus" aria-label="More servings">+</button>
  </div>
  <b>Daily Food page:</b> updates by itself every time the menu is shuffled, a meal is swapped or the servings change.
  <select id="menuWeek" aria-label="Which week this menu is for" hidden></select>
  <a href="../dailyfood/index.html" target="_blank" rel="noopener">Open Daily Food page</a>
  <span class="gap"></span>
  <button id="dailyFile" title="For using the Daily Food page on a different computer or tablet">Download file for other devices</button>
</div>
<div id="tvbar">
  <span id="tvStatus">📺 TV: checking…</span>
  <span class="gap"></span>
  <button id="tvSend" title="Send this menu to the AbleSign TV now">Send to TV now</button>
  <button id="tvSetup" title="Paste the GitHub key that lets this page update the TV">Connect TV</button>
</div>
<div id="status"></div>
<div id="wrap"><canvas id="c" width="3840" height="2160"></canvas></div>
<div id="hint">Tip: click any single meal on the menu to swap just that one.</div>
<img id="grocPrintPage" alt="Grocery list">
<section id="grocBox" aria-label="Grocery list">
  <div class="ghead">
    <h2>Grocery List</h2><span class="gsub" id="grocSub"></span>
    <div class="gtools"><button id="grocClear">Clear ticks</button><button id="grocPrint">Print list</button><button id="grocHide">Hide</button></div>
  </div>
  <div id="grocList"></div>
</section>

/* ---------- reading the CSV ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/,"");
  var first = text.split(/\r?\n/)[0] || "";
  var d = ",";
  if (first.split(";").length > first.split(d).length) d = ";";
  if (first.split("\t").length > first.split(d).length) d = "\t";
  var rows=[], row=[], cell="", q=false;
  for (var i=0;i<text.length;i++){
    var ch=text[i];
    if (q){
      if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    } else if (ch==='"') q=true;
    else if (ch===d){ row.push(cell); cell=""; }
    else if (ch==="\n"||ch==="\r"){
      if (ch==="\r"&&text[i+1]==="\n") i++;
      row.push(cell); rows.push(row); row=[]; cell="";
    } else cell+=ch;
  }
  if (cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function loadList(text){
  var rows = parseCSV(text), found = {}, order = [], skipped = [], count = 0, newNotes = [], newGroc = {};
  for (var r=0;r<rows.length;r++){
    var cells = rows[r].map(function(s){return (s||"").replace(/\s+/g," ").trim();});
    if (!cells.join("")) continue;                               // blank row
    if (r===0 && /^categor/i.test(cells[0])) continue;           // heading row
    var cat = cells[0], lines = cells.slice(1,4).filter(Boolean);
    if (/^notes?$/i.test(cat)){ if (cells[1]) newNotes.push(cells[1]); continue; }
    if (/^grocer(y|ies)$/i.test(cat)){ if (cells[1]) newGroc[cells[1].toLowerCase()]={name:cells[1], section:cells[2]||"Other", always:/^(always|yes|y|x)$/i.test(cells[3]||"")}; continue; }
    lines.protein = (cells[4]||'').toLowerCase();
    lines.ing = (cells[5]||'').split(/[;|]/).map(function(x){return x.trim();}).filter(Boolean);
    if (!cat || !lines.length){ skipped.push(r+1); continue; }
    var key = cat.toLowerCase();
    if (!found[key]){ found[key] = {name:cat, list:[]}; order.push(key); }
    var dup = found[key].list.some(function(m){return m.join("|").toLowerCase()===lines.join("|").toLowerCase();});
    if (!dup){ found[key].list.push(lines); count++; }
  }
  if (!count) return {ok:false, msg:"No meals were found in that file. It needs a Category column followed by Item 1, Item 2, Item 3."};
  order.sort(function(a,b){
    var ia=KNOWN_ORDER.indexOf(a), ib=KNOWN_ORDER.indexOf(b);
    if (ia<0&&ib<0) return 0; if (ia<0) return 1; if (ib<0) return -1; return ia-ib;
  });
  meals = {}; catNames = []; notes = newNotes; grocery = newGroc;
  order.forEach(function(k){ meals[k]=found[k].list; catNames.push(found[k].name); });
  var parts = order.map(function(k){return found[k].list.length+" "+found[k].name.toLowerCase();});
  var msg = "Food list loaded: "+parts.join(", ")+".";
  if (skipped.length) msg += " Skipped row"+(skipped.length>1?"s ":" ")+skipped.join(", ")+" (missing a category or a first item).";
  return {ok:true, msg:msg};
}

/* ---------- shuffling ---------- */
function shuffled(n){
  var a=[]; for (var i=0;i<n;i++) a.push(i);
  for (i=n-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

var KINDS = [["oatmeal"],["omelet","omelette"],["pancake"],["waffle"],["french toast"],["bagel"],["parfait"],["cereal"],["cream of wheat"],
  ["burrito"],["quesadilla"],["taco"],["wrap"],["sandwich","melt"],["burger","hamburger"],["chowder","soup"],["chili"],["stew"],
  ["stir-fry","stir fry"],["casserole"],["lasagna"],["alfredo"],["meatball"],["meatloaf"],["salad"]];
function kindOf(m){
  var s=String(m&&m[0]||"").toLowerCase();
  for (var i=0;i<KINDS.length;i++) for (var j=0;j<KINDS[i].length;j++) if (s.indexOf(KINDS[i][j])>=0) return KINDS[i][0];
  return s.replace(/\s+/g," ").trim();
}
function repeats(m){   // how many mains repeat a kind already used that week
  var seen={}, n=0;
  m.forEach(function(day){ day.forEach(function(idx,ci){ var k=kindOf(meals[catNames[ci].toLowerCase()][idx]); if (seen[k]) n++; seen[k]=true; }); });
  return n;
}
function clashes(m){   // days where two meals share the same main protein
  var n=0;
  m.forEach(function(day){ var seen={};
    day.forEach(function(idx,ci){ var p=meals[catNames[ci].toLowerCase()][idx].protein;
      if (p){ if (seen[p]) n++; seen[p]=true; } });
  });
  return n;
}
function shuffleAll(){
  var best=null, bestN=1e9;
  for (var t=0; t<500 && bestN>0; t++){ var m=dealWeek(), n=clashes(m)+10*repeats(m); if (n<bestN){ best=m; bestN=n; } }
  menu=best; newMenuId(); saveMenu(); draw();
  if (/^There is no other/.test(statusEl.textContent)) say("");
}
/* Protein rotation for lunch and dinner (each checked on its own):
   chicken, beef and fish take turns, so the same protein is never served two days in a row
   and each one is used as evenly as 7 days allow (3, 2 and 2). Lunch and dinner on the same
   day always get different proteins. Turkey counts with chicken; salmon, tuna, cod, tilapia
   and shrimp count as fish. Lunches and dinners with no chicken, beef or fish are not used. */
var ROTATE = ["lunch","dinner"], GROUPS = ["chicken","beef","fish"];
function pgroup(p){
  p=(p||"").toLowerCase();
  if (/chicken|turkey|poultry/.test(p)) return "chicken";
  if (/beef|steak/.test(p)) return "beef";
  if (/fish|salmon|tuna|cod|tilapia|catfish|shrimp|seafood/.test(p)) return "fish";
  return "";
}
function groupsIn(list){ return GROUPS.filter(function(g){ return list.some(function(m){ return pgroup(m.protein)===g; }); }); }
function deckOf(idx){                                 // a shuffled order that only repeats once all are used
  var deck=[];
  while (deck.length < DAYS.length){
    var next=shuffled(idx.length).map(function(i){ return idx[i]; });
    if (deck.length && idx.length>1 && next[0]===deck[deck.length-1]) next.push(next.shift());
    deck=deck.concat(next);
  }
  return deck;
}
function dealWeek(){
  var menu = DAYS.map(function(){return [];}), usedK = {};
  function take(deck,list){                           // next meal whose kind of main is not used yet this week
    for (var i=0;i<deck.length;i++){ var k=kindOf(list[deck[i]]); if (!usedK[k]){ usedK[k]=true; return deck.splice(i,1)[0]; } }
    return deck.shift();
  }
  var order = shuffled(GROUPS.length), shift = 1+Math.floor(Math.random()*(GROUPS.length-1));
  catNames.forEach(function(name,ci){
    var key=name.toLowerCase(), list=meals[key], all=list.map(function(_,i){ return i; });
    var r=ROTATE.indexOf(key), have=groupsIn(list);
    if (r<0 || have.length<2){                        // breakfast (or not enough proteins): plain shuffle
      var deck=deckOf(all); for (var d=0; d<DAYS.length; d++) menu[d][ci]=take(deck,list); return;
    }
    var seq=order.map(function(i){ return GROUPS[i]; }).filter(function(g){ return have.indexOf(g)>=0; });
    var decks={}; seq.forEach(function(g){ decks[g]=deckOf(all.filter(function(i){ return pgroup(list[i].protein)===g; })); });
    for (var d2=0; d2<DAYS.length; d2++){
      var g=seq[(d2 + r*shift) % seq.length];
      menu[d2][ci]=take(decks[g],list);
    }
  });
  return menu;
}
function swapOne(d,ci){
  var key=catNames[ci].toLowerCase(), list=meals[key], n=list.length, cur=menu[d][ci], same=function(){ return true; };
  if (ROTATE.indexOf(key)>=0 && groupsIn(list).length>=2){       // keep the protein rotation: swap within the same protein
    var g0=pgroup(list[cur].protein); same=function(i){ return pgroup(list[i].protein)===g0; };
  }
  var used={}, weekK={}, others={};
  menu.forEach(function(day,dd){ day.forEach(function(idx,c){
    if (c===ci) used[idx]=true;
    if (!(dd===d&&c===ci)) weekK[kindOf(meals[catNames[c].toLowerCase()][idx])]=true;   // kinds of main already this week
    if (dd===d&&c!==ci){ var p=meals[catNames[c].toLowerCase()][idx].protein; if (p) others[p]=true; }
  }); });
  var cand=[]; for (var i=0;i<n;i++) if (i!==cur && same(i) && !weekK[kindOf(list[i])]) cand.push(i);   // never repeat a main
  if (!cand.length){ say("There is no other "+catNames[ci].toLowerCase()+" that would not repeat a main dish this week. Add more meals to the food list or click Shuffle."); return; }
  [function(i){ return !used[i] && !others[list[i].protein]; }, function(i){ return !used[i]; }, function(){ return true; }].some(function(f){
    var c=cand.filter(f); if (c.length){ cand=c; return true; } return false; });
  menu[d][ci] = cand[Math.floor(Math.random()*cand.length)];
  saveMenu(); draw();
}
function saveMenu(){ store("bh_menu", JSON.stringify(menu)); syncDaily(); }
// If the two-week version of the app was opened, its "this week" menu is picked up so the posted menu does not change.
function fromWeeks(){
  try{
    var all=JSON.parse(recall("bh_weeks")||"{}"), t=new Date(), d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7));
    var w=all[d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)];
    if (!w || !w.days || w.days.length!==DAYS.length) return;
    var cats=(w.cats||[]).map(function(s){ return String(s).toLowerCase(); });
    var m=w.days.map(function(day){ return catNames.map(function(name){
      var j=cats.indexOf(name.toLowerCase()), o=j>=0?day[j]:null, list=meals[name.toLowerCase()];
      if (!o || !o.l) return -1;
      for (var i=0;i<list.length;i++) if (list[i].join("|").toLowerCase()===o.l.join("|").toLowerCase()) return i;
      return -1; }); });
    if (m.every(function(day){ return day.every(function(v){ return v>=0; }); })) store("bh_menu",JSON.stringify(m));
  }catch(e){}
}
function restoreMenu(){
  if (!recall("bh_menu")) fromWeeks();
  try{
    var m = JSON.parse(recall("bh_menu"));
    if (!m || m.length!==DAYS.length) return false;
    for (var d=0;d<m.length;d++){
      if (m[d].length!==catNames.length) return false;
      for (var c=0;c<catNames.length;c++){
        var v=m[d][c]; if (typeof v!=="number"||v<0||v>=meals[catNames[c].toLowerCase()].length) return false;
      }
    }
    menu=m; return true;
  }catch(e){ return false; }
}

/* ---------- drawing the menu ---------- */
var F_FOOD = '"Segoe UI",Arial,Helvetica,"Liberation Sans",sans-serif';
// Text sizes, in page units (the page is 1920 wide; on Letter paper 1 unit is about 0.39 pt)
var STD = {title:38, food:29, label:25, line:32.5, labelH:29, gap:8, indent:28};   // whole week on one page
var BIG = {title:66, food:49, label:44, line:54, labelH:52, gap:20, indent:44, plain:true};   // large print: 18 pt and up
var INK = "#111", NAVY = "#2c3a7a";

function mealFor(d,ci){ return meals[catNames[ci].toLowerCase()][menu[d][ci]]; }
function emojiFor(s){ for (var i=0;i<EMOJI.length;i++) if (EMOJI[i][0].test(s)) return " "+EMOJI[i][1]; return ""; }
function wrap(c,txt,maxW){
  var out=[], cur="";
  txt.split(" ").forEach(function(w){
    var t=cur?cur+" "+w:w;
    if (c.measureText(t).width>maxW && cur){ out.push(cur); cur=w; } else cur=t;
  });
  if (cur) out.push(cur);
  return out;
}
function foodFont(P,k){ return "600 "+(P.food*k)+"px "+F_FOOD; }
// Works out how a day's text wraps and how tall it is.  Long names wrap onto a second line; they are never shrunk.
function dayLayout(c,d,w,P,k){
  c.font=foodFont(P,k);
  var h=0, out=[];
  catNames.forEach(function(_,ci){
    var n=0, m=mealFor(d,ci).map(function(line,li){
      var L=wrap(c, line, w-P.indent*k), e=(li===0&&!P.plain)?emojiFor(line):"";
      if (e && c.measureText(L[L.length-1]+e).width<=w-P.indent*k) L[L.length-1]+=e;
      n+=L.length; return L;
    });
    h+=(P.labelH+n*P.line+P.gap)*k; out.push(m);
  });
  return {h:h-P.gap*k, meals:out};
}
// One text size for the whole page: the largest that lets every day fit.
function fitScale(c,list,P){
  for (var k=1; k>0.5; k-=0.01)
    if (list.every(function(o){ return dayLayout(c,o.d,o.w,P,k).h<=o.avail; })) return k;
  return 0.5;
}
function drawDay(c,d,x,w,titleY,top,P,k,rec){
  c.textBaseline="alphabetic"; c.textAlign="center"; c.fillStyle=INK;
  c.font=P.plain ? "bold "+P.title+"px "+F_FOOD : "italic 900 "+P.title+"px "+F_TITLE;
  c.fillText(DAYS[d], x+w*0.42, titleY);
  c.textAlign="left";
  var L=dayLayout(c,d,w,P,k), y=top;
  L.meals.forEach(function(m,ci){
    var t0=y;
    c.font="bold "+(P.label*k)+"px "+F_FOOD; c.fillStyle=NAVY;
    y+=P.labelH*k; c.fillText(catNames[ci].toUpperCase(), x, y-P.labelH*k*0.2);
    c.fillStyle=INK; c.font=foodFont(P,k);
    m.forEach(function(lines){
      lines.forEach(function(t,i){
        y+=P.line*k;
        var base=y-P.line*k*0.24;
        if (i===0){ c.beginPath(); c.arc(x+P.indent*k*0.45, base-P.food*k*0.33, P.food*k*0.13, 0, 6.3); c.fill(); }
        c.fillText(t, x+P.indent*k, base);
      });
    });
    if (rec) hits.push({x:x-6,y:t0,w:w+12,h:y-t0+4,d:d,ci:ci});
    if (ci<L.meals.length-1){
      var ly=y+P.gap*k*0.5;
      c.strokeStyle="#9a6fd6"; c.lineWidth=2; c.beginPath(); c.moveTo(x-4,ly); c.lineTo(x+w,ly); c.stroke();
    }
    y+=P.gap*k;
  });
}

// The original picture is wide and short.  To fill a Letter page, extra plain background is added
// across the middle (where there are no pictures), so every picture keeps its size and corner.
function paintTallBackground(c){
  var extra=PAGE_H-1080, a=538, b=558;
  c.drawImage(bg,0,0,1920,a, 0,0,1920,a);
  c.drawImage(bg,0,a,1920,b-a, 0,a-1,1920,b-a+extra+2);
  c.drawImage(bg,0,b,1920,1080-b, 0,b+extra,1920,1080-b);
}
// The on-screen menu: the whole week on one page.
function draw(){
  var S=canvas.width/1920;
  ctx.setTransform(S,0,0,S,0,0);
  ctx.clearRect(0,0,1920,PAGE_H);
  paintTallBackground(ctx);
  hits=[];
  if (!menu) return;
  var list=COLS.map(function(col,d){ return {d:d,w:col.w,avail:ROWS[col.row].bottom-ROWS[col.row].top}; });
  var k=fitScale(ctx,list,STD);
  COLS.forEach(function(col,d){ drawDay(ctx,d,col.x,col.w,ROWS[col.row].title,ROWS[col.row].top,STD,k,true); });
  // the first Note row goes bottom right, same size as the food text
  if (notes.length){
    var size=STD.food*k, lines;
    ctx.fillStyle=NAVY; ctx.textAlign="left";
    for (;;){ ctx.font="600 "+size+"px "+F_FOOD; lines=wrap(ctx,notes[0],530); if (lines.length<=2||size<=20) break; size-=1; }
    lines.slice(0,2).forEach(function(l,i){ ctx.fillText(l,1102,1036+i*(size+5)); });
  }
}

// Large print: two days per page, 18 pt text or bigger.  Returns one canvas per page.
function largePrintPages(){
  var pages=[], slots=[{x:172,w:768},{x:978,w:752}], TOP=205, BOTTOM=985;
  for (var p=0; p<DAYS.length; p+=2){
    var cv=document.createElement("canvas"); cv.width=2880; cv.height=1620;
    var c=cv.getContext("2d"), S=cv.width/1920;
    c.setTransform(S,0,0,S,0,0); c.drawImage(bg,0,0,1920,1080);
    var days=[p]; if (p+1<DAYS.length) days.push(p+1);
    var k=fitScale(c, days.map(function(d,i){ return {d:d,w:slots[i].w,avail:BOTTOM-TOP}; }), BIG);
    days.forEach(function(d,i){ drawDay(c,d,slots[i].x,slots[i].w,185,TOP,BIG,k,false); });
    if (days.length===1 && notes.length){        // last page: the notes get the empty half
      var x=slots[1].x, y=TOP;
      c.textAlign="left"; c.fillStyle=NAVY; c.font="bold "+BIG.label+"px "+F_FOOD;
      y+=BIG.labelH; c.fillText("PLEASE NOTE", x, y-BIG.labelH*0.2);
      c.fillStyle=INK; c.font=foodFont(BIG,1);
      notes.forEach(function(n){
        wrap(c,n,slots[1].w).forEach(function(l){ y+=BIG.line; if (y<=BOTTOM) c.fillText(l,x,y-BIG.line*0.24); });
        y+=BIG.gap;
      });
    }
    pages.push(cv);
  }
  return pages;
}

/* ---------- downloads ---------- */
function fileName(ext,tag){
  // the date and the time (to the second) go in the name, so two downloads never share a name
  var t=new Date(), p=function(n){return (n<10?"0":"")+n;}, h=t.getHours();
  var stamp=t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())+" "+p(h%12||12)+"-"+p(t.getMinutes())+"-"+p(t.getSeconds())+(h<12?" AM":" PM");
  return "Blossom Hill "+(tag||"Menu")+" "+stamp+"."+ext;
}
function saveBlob(blob,name,extra){
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
  say("Saved \""+name+"\" to your Downloads folder."+(extra||""));
}
function downloadPNG(){          // saved at exactly 1920 x 1080 for a monitor or TV
  var out=document.createElement("canvas"); out.width=1920; out.height=PAGE_H;
  var o=out.getContext("2d"); o.imageSmoothingQuality="high"; o.drawImage(canvas,0,0,1920,PAGE_H);
  out.toBlob(function(b){ saveBlob(b,fileName("png")); },"image/png");
}
// Builds a PDF with one Letter page per picture (landscape for the menu, portrait for the grocery list).
function makePDF(canvases,fullPage){
  var enc=function(s){ var u=new Uint8Array(s.length); for (var i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&255; return u; };
  var chunks=[], offs=[], pos=0, n=canvases.length;
  var put=function(u){ chunks.push(u); pos+=u.length; };
  var obj=function(num,body,stream){
    offs[num]=pos; put(enc(num+" 0 obj\n"+body+"\n"));
    if (stream){ put(enc("stream\n")); put(stream); put(enc("\nendstream\n")); }
    put(enc("endobj\n"));
  };
  put(enc("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
  var kids=[]; for (var i=0;i<n;i++) kids.push((3+3*i)+" 0 R");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>");
  canvases.forEach(function(cv,i){
    var PW=792, PH=612, M=18;
    if (fullPage){ PW=612; PH=792; M=0; }
    var bin=atob(cv.toDataURL("image/jpeg",0.93).split(",")[1]);
    var jpg=new Uint8Array(bin.length); for (var j=0;j<bin.length;j++) jpg[j]=bin.charCodeAt(j);
    var w=PW-2*M, h=w*cv.height/cv.width, y=(PH-h)/2, a=3+3*i;
    var content="q "+w.toFixed(2)+" 0 0 "+h.toFixed(2)+" "+M+" "+y.toFixed(2)+" cm /Im0 Do Q";
    obj(a,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /XObject << /Im0 "+(a+1)+" 0 R >> >> /Contents "+(a+2)+" 0 R >>");
    obj(a+1,"<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>",jpg);
    obj(a+2,"<< /Length "+content.length+" >>",enc(content));
  });
  var total=3+3*n, xref=pos, pad=function(v){ return ("0000000000"+v).slice(-10); };
  var t="xref\n0 "+total+"\n0000000000 65535 f \n";
  for (i=1;i<total;i++) t+=pad(offs[i])+" 00000 n \n";
  t+="trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n";
  put(enc(t));
  return new Blob(chunks,{type:"application/pdf"});
}
function downloadPDF(){ saveBlob(makePDF([canvas]),fileName("pdf")); }
function downloadLarge(){
  var pages=largePrintPages();
  saveBlob(makePDF(pages),fileName("pdf","LARGE PRINT ")," It has "+pages.length+" pages, two days on each.");
}

/* ---------- grocery list ---------- */
var DAY_SHORT = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
// Everything the week on screen needs: each ingredient, its store section, and the days it is used.
function groceryData(){
  var items={}, missing=[];
  function add(name,d,meal){
    var key=name.toLowerCase(), g=grocery[key];
    if (!items[key]) items[key]={name:g?g.name:name, section:g?g.section:"Other", days:{}, always:false, uses:[]};
    if (d>=0){ items[key].days[d]=true; if (meal) items[key].uses.push({d:d, meal:meal}); }
  }
  for (var d=0; d<DAYS.length; d++) catNames.forEach(function(_,ci){
    var m=mealFor(d,ci);
    if (!m.ing.length) missing.push(m[0]); else m.ing.forEach(function(n){ add(n,d,m[0]); });
  });
  Object.keys(grocery).forEach(function(k){ if (grocery[k].always){ add(grocery[k].name,-1); items[k].always=true; } });
  var order=[]; Object.keys(grocery).forEach(function(k){ if (order.indexOf(grocery[k].section)<0) order.push(grocery[k].section); });
  order.push("Other");
  var sections=[];
  order.forEach(function(sec){
    var list=Object.keys(items).map(function(k){return items[k];}).filter(function(it){return it.section===sec;});
    list.sort(function(a,b){ return a.name.toLowerCase()<b.name.toLowerCase()?-1:1; });
    if (list.length) sections.push({name:sec, items:list});
  });
  return {sections:sections, missing:missing.filter(function(v,i,a){return a.indexOf(v)===i;})};
}
// Draws the list on ONE Letter page (portrait), two columns, with a box to tick for each item.
// If the list is long, every row is made a little smaller so it still fits the one page.
function groceryPages(){
  var data=groceryData(), W=1700, H=2200, M=110, GAP=60, COLW=(W-2*M-GAP)/2, TOP=290, BOTTOM=H-140;
  var flow=[], total=0;
  data.sections.forEach(function(s){ flow.push({head:s.name}); s.items.forEach(function(it){ flow.push({item:it}); total++; }); });
  var cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  var c=cv.getContext("2d");
  // lays the list out at size z; draws it only when paint is true; returns whether it fits
  function layout(z,paint){
    var col=0, y=TOP, ROW=44*z, HEAD=58*z, ok=true;
    flow.forEach(function(f){
      var need=f.head ? HEAD+8*z+ROW : ROW;       // a heading stays with its first item
      if (y+need>BOTTOM){ if (col===0){ col=1; y=TOP; } else ok=false; }
      var x=M+col*(COLW+GAP);
      if (f.head){
        y+=HEAD;
        if (paint){
          c.fillStyle="#2c3a7a"; c.font="bold "+(36*z)+"px "+F_FOOD; c.fillText(f.head.toUpperCase(),x,y-12*z);
          c.strokeStyle="#b9a2e6"; c.lineWidth=3; c.beginPath(); c.moveTo(x,y); c.lineTo(x+COLW,y); c.stroke();
        }
        y+=8*z;
      } else {
        y+=ROW;
        if (paint){
          var it=f.item, days=Object.keys(it.days).map(Number).sort(function(p,q){return p-q;});
          var when=days.length===7?"every day":days.map(function(d){return DAY_SHORT[d];}).join(" ");
          if (!days.length) when="keep on hand"; else if (it.always) when+=" + on hand";
          c.strokeStyle="#111"; c.lineWidth=3; c.strokeRect(x+2,y-30*z,27*z,27*z);
          c.fillStyle="#111"; c.font="600 "+(31*z)+"px "+F_FOOD; c.fillText(it.name,x+46*z,y-7*z);
          var used=46*z+c.measureText(it.name).width+22, size=25*z;
          c.fillStyle="#444"; c.textAlign="right";
          for (;;){ c.font=size+"px "+F_FOOD; if (c.measureText(when).width<=COLW-used||size<=17) break; size-=1; }
          if (c.measureText(when).width>COLW-used) when=days.length+" days";
          c.fillText(when,x+COLW,y-8*z); c.textAlign="left";
        }
      }
    });
    return ok;
  }
  var z=1; while (z>0.3 && !layout(z,false)) z-=0.01;
  c.fillStyle="#fff"; c.fillRect(0,0,W,H); c.textBaseline="alphabetic"; c.textAlign="left";
  c.fillStyle="#2c3a7a"; c.font="bold 76px "+F_FOOD; c.fillText("Blossom Hill Grocery List",M,170);
  c.fillStyle="#333"; c.font="34px "+F_FOOD;
  c.fillText("For the weekly menu made "+new Date().toLocaleString([], {dateStyle:"medium", timeStyle:"short"})+"  -  "+total+" items",M,230);
  c.strokeStyle="#7b4fc4"; c.lineWidth=5; c.beginPath(); c.moveTo(M,262); c.lineTo(W-M,262); c.stroke();
  layout(z,true);
  c.fillStyle="#333"; c.font="28px "+F_FOOD;
  c.fillText("The days show when each item is used. Amounts are not listed: buy enough for the residents you serve.",M,H-96);
  if (data.missing.length){
    c.fillStyle="#a01818"; c.font="bold 28px "+F_FOOD;
    wrap(c,"No ingredients listed in the food list for: "+data.missing.join(", "),W-2*M).slice(0,2).forEach(function(l,j){ c.fillText(l,M,H-58+j*32); });
  }
  return {pages:[cv], total:total, missing:data.missing, scale:z};
}
function downloadGrocery(){
  var r=groceryPages();
  saveBlob(makePDF(r.pages,true),fileName("pdf","Grocery List"),
    " It lists "+r.total+" items for the menu on screen."+(r.missing.length?" Some meals have no ingredients listed; they are named at the bottom of the list.":""));
}

/* ---------- grocery list on the page ---------- */
function escH(t){ return String(t).replace(/[&<>"]/g,function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]; }); }
function grocTicks(){ try{ var t=JSON.parse(recall("bh_grocticks")||"{}"); return t.id===(recall("bh_menuid")||"1")?t.ticks||{}:{}; }catch(e){ return {}; } }
function saveTicks(t){ store("bh_grocticks",JSON.stringify({id:recall("bh_menuid")||"1", ticks:t})); }
// Shows the grocery list for the menu on screen under the menu. Ticks are kept until a new menu is shuffled.
function renderGrocery(){
  if (!menu || !document.getElementById("grocBox").classList.contains("open")) return;
  var data=groceryData(), ticks=grocTicks(), total=0, html="";
  data.sections.forEach(function(sec){
    html+='<div class="gsec"><h3>'+escH(sec.name.toUpperCase())+'</h3>';   // heading stays with its first item
    sec.items.forEach(function(it,ii){
      total++;
      var key=it.name.toLowerCase(), days=Object.keys(it.days).map(Number).sort(function(p,q){return p-q;});
      // which meal uses it on which day, for example "Thu: Hamburger"
      var byDay={}; it.uses.forEach(function(u){ (byDay[u.d]=byDay[u.d]||[]); if (byDay[u.d].indexOf(u.meal)<0) byDay[u.d].push(u.meal); });
      var use=days.map(function(d){ return DAY_SHORT[d]+": "+byDay[d].join(", "); }).join(" · ");
      if (!days.length) use="Keep on hand"; else if (it.always) use+=" · also keep on hand";
      html+='<label class="gitem'+(ticks[key]?' done':'')+'"><input type="checkbox" data-k="'+escH(key)+'"'+(ticks[key]?' checked':'')+'>'+
        '<span><span class="gname">'+escH(it.name)+'</span><span class="guse">'+escH(use)+'</span></span></label>';
      if (ii===0) html+='</div>';
    });
  });
  if (data.missing.length) html+='<div class="gmiss">No ingredients listed in the food list for: '+escH(data.missing.join(", "))+'</div>';
  html+='<p class="gnote">Tick items as you shop or check the pantry. Amounts are not listed: buy enough for the residents you serve. The list changes by itself when the menu is shuffled or a meal is swapped.</p>';
  document.getElementById("grocList").innerHTML=html;
  var done=Object.keys(ticks).filter(function(k){ return ticks[k]; }).length;
  document.getElementById("grocSub").textContent=total+" items for the menu on screen"+(done?" · "+done+" ticked":"");
}
function showGrocery(open){
  var box=document.getElementById("grocBox"), b=document.getElementById("viewGroc");
  box.classList.toggle("open",open); b.classList.toggle("on",open); b.setAttribute("aria-expanded",open?"true":"false");
  b.textContent=open?"Hide Grocery List":"View Grocery List"; store("bh_grocopen",open?"1":null);
  if (open) renderGrocery();
}
document.getElementById("viewGroc").onclick=function(){
  var open=!document.getElementById("grocBox").classList.contains("open"); showGrocery(open);
  if (open) document.getElementById("grocBox").scrollIntoView({behavior:"smooth", block:"start"});
};
document.getElementById("grocHide").onclick=function(){ showGrocery(false); window.scrollTo({top:0, behavior:"smooth"}); };
document.getElementById("grocClear").onclick=function(){ saveTicks({}); renderGrocery(); };
// Prints the same one-page list as "Download Grocery List".
document.getElementById("grocPrint").onclick=function(){
  var img=document.getElementById("grocPrintPage");
  img.onload=function(){
    img.onload=null; document.body.classList.add("printGroc"); window.print();

document.getElementById("grocList").onchange=function(e){
  var k=e.target && e.target.getAttribute("data-k"); if (!k) return;
  var t=grocTicks(); if (e.target.checked) t[k]=true; else delete t[k]; saveTicks(t); renderGrocery();
};
// keep the list in step with the menu: redraw it every time the menu is drawn
var drawMenuOnly=draw;
draw=function(){ drawMenuOnly.apply(this,arguments); renderGrocery(); };
if (recall("bh_grocopen")) showGrocery(true);

/* ---------- buttons ---------- */
document.getElementById("shuffle").onclick=function(){ shuffleAll(); say("New menu shuffled."); };
document.getElementById("png").onclick=downloadPNG;
document.getElementById("pdf").onclick=downloadPDF;
document.getElementById("groc").onclick=downloadGrocery;
document.getElementById("reset").onclick=function(){
  store("bh_csv",null); var r=loadList(SITE_CSV||DEFAULT_CSV); shuffleAll(); say("Back to the starting list. "+r.msg);
};
document.getElementById("file").onchange=function(ev){
  var f=ev.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var text;
    try{ text=new TextDecoder("utf-8",{fatal:true}).decode(rd.result); }
    catch(e){ text=new TextDecoder("windows-1252").decode(rd.result); }
    var keepM=meals, keepC=catNames, r=loadList(text);
    if (!r.ok){ meals=keepM; catNames=keepC; say(r.msg,true); }
    else { store("bh_csv",text); shuffleAll(); say(r.msg+" The app will remember this list next time you open it."); }
    ev.target.value="";
  };
  rd.onerror=function(){ say("Sorry, that file could not be read.",true); };
  rd.readAsArrayBuffer(f);
};
canvas.onclick=function(ev){
  var b=canvas.getBoundingClientRect(), x=(ev.clientX-b.left)*1920/b.width, y=(ev.clientY-b.top)*PAGE_H/b.height;
  for (var i=0;i<hits.length;i++){ var h=hits[i];
    if (x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){ swapOne(h.d,h.ci); say("Swapped "+DAYS[h.d].toLowerCase()+" "+catNames[h.ci].toLowerCase()+"."); return; }
  }
};

/* ---------- Daily Food page (dailyfood): the menu is sent for a dated week ---------- */
var MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dKey(off){ var t=new Date(), d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7)+7*off); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function dLabel(off){ var k=dKey(off).split("-"), a=new Date(+k[0],+k[1]-1,+k[2]), b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);
  return MON3[a.getMonth()]+" "+a.getDate()+" \u2013 "+(b.getMonth()!==a.getMonth()?MON3[b.getMonth()]+" ":"")+b.getDate(); }
function dailyAll(){ try{ return JSON.parse(recall("bh_daily")||"{}")||{}; }catch(e){ return {}; } }
function weekOffset(k){ for (var o=-2;o<=2;o++) if (dKey(o)===k) return o; return null; }
// Which week the menu on screen is for. A new menu shuffled Saturday or Sunday is for next week;
// on Monday to Friday it is for this week. It can be changed with the "this menu is for" box.
function defaultWeek(){ var g=new Date().getDay(); return dKey(g===6||g===0?1:0); }
function menuWeek(){ var k=recall("bh_menuweek"), o=k?weekOffset(k):null; return (o===0||o===1)?k:null; }
// true when the menu on screen was made for a week that is already over
function menuIsOld(){ var k=recall("bh_menuweek"); if (!k) return false; var o=weekOffset(k); return o===null||o<0; }
function fillWeekBox(){
  var sel=document.getElementById("menuWeek"), cur=menuWeek()||defaultWeek(); sel.innerHTML="";
  if (menuIsOld()){ var old=document.createElement("option"); old.value=""; old.selected=true;
    old.textContent="an earlier week (click Shuffle for a new menu)"; sel.appendChild(old); cur=""; }
  [0,1].forEach(function(o){ var op=document.createElement("option"); op.value=dKey(o);
    op.textContent=(o?"next week":"this week")+" ("+dLabel(o)+")"; if (dKey(o)===cur) op.selected=true; sel.appendChild(op); });
}
// Copies the menu on screen to the Daily Food page for its week. If that week already had a
// different menu, it is kept aside, so moving this menu to the other week puts the old one back.
function syncDaily(){
  if (!menu) return;
  if (menuIsOld()){ fillWeekBox(); say("This menu is from a week that is over, so the Daily Food page does not use it. Click Shuffle to make this week's menu.",true); return; }   // last week's menu is never copied into a new week
  var wk=menuWeek(); if (!wk){ wk=defaultWeek(); store("bh_menuweek",wk); }
  var id=recall("bh_menuid")||"1", all=dailyAll(), oldest=dKey(-2), prev={};
  try{ prev=JSON.parse(recall("bh_dailyprev")||"{}")||{}; }catch(e){}
  Object.keys(all).forEach(function(k){ if (k<oldest) delete all[k]; });
  Object.keys(prev).forEach(function(k){ if (k<oldest) delete prev[k]; });
  if (all[wk] && all[wk].id!==id) prev[wk]=all[wk];
  all[wk]={id:id, sent:new Date().toISOString(), cats:catNames.slice(), servings:weekServ(),
    days:menu.map(function(day){ return day.map(function(idx,ci){ return meals[catNames[ci].toLowerCase()][idx].slice(); }); })};
  store("bh_dailyprev",JSON.stringify(prev)); store("bh_daily",JSON.stringify(all)); fillWeekBox();
  tvSoon();
}

/* ---------- Send to TV: saves the menu straight to the website through GitHub ----------
   The GitHub key is kept only in this browser on this computer (never in the website files).
   After a shuffle, swap or servings change, the menu is sent by itself about 20 seconds later. */
var TV_REPO="blossomHillLLC/blossomHillLLC.github.io", TV_BRANCH="main", TV_PATH="dailyfood/daily_menu.json", tvTimer=null, tvBusy=false;
function tvKey(){ return (recall("bh_tvkey")||"").trim(); }
function tvSay(msg,cls){ var el=document.getElementById("tvStatus"); if(!el) return; el.textContent=msg; el.className=cls||""; }
function tvText(){ return JSON.stringify({weeks:dailyAll()},null,1); }
function tvSame(){ return JSON.stringify({weeks:dailyAll()},function(k,v){ return k==="sent"?undefined:v; }); }   // ignores the time stamp
function tvShowState(){
  if (!tvKey()){ tvSay("📺 TV: not connected yet. Click “Connect TV” once, then menus go to the TV by themselves."); document.getElementById("tvSetup").textContent="Connect TV"; return; }
  document.getElementById("tvSetup").textContent="Change key";
  var last=recall("bh_tvwhen");
  if (recall("bh_tvlast")===tvSame()) tvSay("📺 This menu is on the TV"+(last?" (sent "+last+")":"")+" ✓","ok");
  else tvSay("📺 TV connected. This menu will be sent in a moment…");
}
function tvSoon(){ if (!tvKey() || menuIsOld()) return; clearTimeout(tvTimer); if (recall("bh_tvlast")===tvSame()){ tvShowState(); return; }
  tvSay("📺 Sending this menu to the TV in a few seconds…"); tvTimer=setTimeout(function(){ tvSend(false); },20000); }
function tvSend(manual){
  clearTimeout(tvTimer);
  var key=tvKey(); if (!key){ tvSay("📺 Click “Connect TV” first.","err"); return; }
  if (!Object.keys(dailyAll()).length){ tvSay("📺 Shuffle a menu first.","err"); return; }
  if (tvBusy) return; tvBusy=true; tvSay("📺 Sending to the TV…");
  var url="https://api.github.com/repos/"+TV_REPO+"/contents/"+TV_PATH, h={"Authorization":"Bearer "+key,"Accept":"application/vnd.github+json"};
  var same=tvSame(), text=tvText();
  fetch(url+"?ref="+TV_BRANCH+"&t="+Date.now(),{headers:h,cache:"no-store"}).then(function(r){
    if (r.status===401) throw new Error("key");
    return r.status===404 ? null : r.json();
  }).then(function(cur){
    var body={message:"Update menu for the TV", branch:TV_BRANCH, content:btoa(unescape(encodeURIComponent(text)))};
    if (cur && cur.sha) body.sha=cur.sha;
    return fetch(url,{method:"PUT",headers:h,body:JSON.stringify(body)});
  }).then(function(r){
    if (r.status===401) throw new Error("key");
    if (r.status===403||r.status===404) throw new Error("perm");
    if (!r.ok) throw new Error("other "+r.status);
    var when=new Date().toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"});
    store("bh_tvlast",same); store("bh_tvwhen",when);
    tvSay("📺 Sent to the TV "+when+" ✓  It shows on the TV within a few minutes.","ok");
  }).catch(function(e){
    var m=String(e&&e.message||e);
    if (m==="key") tvSay("📺 The GitHub key did not work (it may have expired). Click “Change key” and paste a new one.","err");
    else if (m==="perm") tvSay("📺 The key is not allowed to change the website. Make a new key with Contents: Read and write for blossomHillLLC.github.io.","err");
    else tvSay("📺 Could not reach GitHub (check the internet). Click “Send to TV now” to try again.","err");
  }).then(function(){ tvBusy=false; });
}
document.getElementById("tvSend").onclick=function(){ tvSend(true); };
document.getElementById("tvSetup").onclick=function(){
  var k=window.prompt("Paste your GitHub key for the TV (it starts with github_pat_).\nIt is saved only in this browser on this computer.\nLeave it empty and click OK to disconnect.", "");
  if (k===null) return;
  k=k.trim(); store("bh_tvkey",k||null); store("bh_tvlast",null);
  if (!k){ tvShowState(); return; }
  tvSend(true);
};
// Servings for the week of the menu on screen (4 unless changed). Saved with that week's menu.
function weekServ(){ var n=parseInt(recall("bh_weekserv"),10); return (n>0&&n<=60)?n:4; }
function setWeekServ(n){
  n=Math.max(1,Math.min(60,parseInt(n,10)||4)); store("bh_weekserv",String(n));
  document.getElementById("wServ").value=n; syncDaily();
  if (!menuIsOld()) say("The Daily Food page now shows ingredients for "+n+" serving"+(n===1?"":"s")+" for this menu's week.");
}
document.getElementById("wServ").value=weekServ();
document.getElementById("wsMinus").onclick=function(){ setWeekServ(weekServ()-1); };
document.getElementById("wsPlus").onclick=function(){ setWeekServ(weekServ()+1); };
document.getElementById("wServ").onchange=function(){ setWeekServ(this.value); };
function newMenuId(){ store("bh_menuid",String(Date.now())); store("bh_menuweek",defaultWeek()); }
document.getElementById("menuWeek").onchange=function(){
  if (!this.value){ fillWeekBox(); return; }
  var from=menuWeek(), to=this.value, all=dailyAll(), prev={};
  try{ prev=JSON.parse(recall("bh_dailyprev")||"{}")||{}; }catch(e){}
  if (from && from!==to && all[from] && all[from].id===(recall("bh_menuid")||"1")){
    if (prev[from]){ all[from]=prev[from]; delete prev[from]; } else delete all[from];
    store("bh_daily",JSON.stringify(all)); store("bh_dailyprev",JSON.stringify(prev));
  }
  store("bh_menuweek",to); syncDaily();
  say("The Daily Food page now uses this menu for "+this.options[this.selectedIndex].textContent+".");
};
document.getElementById("dailyFile").onclick=function(){
  var all=dailyAll();
  if (!Object.keys(all).length){ say("Send a menu to the Daily Food page first, then download the file.",true); return; }
  saveBlob(new Blob([JSON.stringify({weeks:all},null,1)],{type:"application/json"}),"daily_menu.json",
    " Put it in the dailyfood folder of the website (replacing the old one) and publish the website.");
};

var SITE_CSV=null;
/* ---------- start ---------- */
bg.onload=function(){
  // a new copy of the app starts fresh, so an old saved list cannot hide the new starting list
  var ver=String(DEFAULT_CSV.length)+":"+DEFAULT_CSV.split("").reduce(function(x,ch){return (x*31+ch.charCodeAt(0))%1000003;},7);
  if (recall("bh_ver")!==ver){ store("bh_csv",null); store("bh_menu",null); store("bh_weeks",null); store("bh_ver",ver); }
  var saved=recall("bh_csv"), r=null;
  if (saved){ r=loadList(saved); if(!r.ok) r=null; }
  var usingSaved=!!r;
  if (!r) r=loadList(DEFAULT_CSV);
  if (!restoreMenu()) shuffleAll(); else { draw(); syncDaily(); }
  tvShowState(); tvSoon();
  say((usingSaved?"Using the food list you loaded last time. ":"Using the starting food list. ")+r.msg);
  // On the website: read menu_items.csv from this same folder, so editing that file updates the menu everywhere.
  if (!usingSaved && /^https?:$/.test(location.protocol) && window.fetch){
    fetch("menu_items.csv",{cache:"no-store"}).then(function(res){ if(!res.ok) throw 0; return res.arrayBuffer(); }).then(function(buf){
      var text;
      try{ text=new TextDecoder("utf-8",{fatal:true}).decode(buf); }
      catch(e){ text=new TextDecoder("windows-1252").decode(buf); }
      var keepM=meals, keepC=catNames, r2=loadList(text);
      if (!r2.ok){ meals=keepM; catNames=keepC; say("menu_items.csv on the website has a problem, so the built-in list is being used. "+r2.msg,true); return; }
      SITE_CSV=text;
      var sig=String(text.length)+":"+text.split("").reduce(function(x,ch){return (x*31+ch.charCodeAt(0))%1000003;},7);
      if (recall("bh_site")!==sig){ store("bh_site",sig); shuffleAll(); }
      else if (!restoreMenu()) shuffleAll(); else { draw(); syncDaily(); }
      say("Using menu_items.csv from the website. "+r2.msg);
    }).catch(function(){});
  }
};
bg.src=BG_DATA;
</script>
